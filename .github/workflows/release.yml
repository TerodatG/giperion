name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      PYTHONIOENCODING: utf-8

    # Giperion лежит в app/giperion, Kraper — рядом в app/Kraper:
    # модель ставится как пакет kraper_model из соседней папки.
    defaults:
      run:
        working-directory: app/giperion

    steps:
      - uses: actions/checkout@v4
        with:
          path: app/giperion

      - uses: actions/checkout@v4
        with:
          repository: TerodatG/kraper
          path: app/Kraper

      - name: Версия
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            app/giperion/requirements.txt
            app/giperion/requirements-dev.txt
            app/Kraper/pyproject.toml

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ../Kraper
          python -m pip install pyinstaller

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfuse2

      - name: appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Сборка
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >
          python -m tools.build_release
          --target ${{ matrix.target }}
          --version ${{ steps.version.outputs.value }}

      - name: Проверка сумм
        run: python -m tools.verify_release --folder dist

      - name: Патч для автообновления
        if: matrix.target != 'macos'
        run: >
          python -m tools.update_feed pack
          --app dist/Giperion
          --out dist/patch-${{ matrix.target }}.zip

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: giperion-${{ matrix.target }}
          path: |
            app/giperion/dist/*.exe
            app/giperion/dist/*.zip
            app/giperion/dist/*.deb
            app/giperion/dist/*.AppImage
            app/giperion/dist/*.tar.gz
            app/giperion/dist/*.dmg
            app/giperion/dist/patch-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Каталог выпусков
        run: |
          python -m tools.update_feed feeds \
            --dist dist \
            --version "${GITHUB_REF_NAME#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Контрольные суммы
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
