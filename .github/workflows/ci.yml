name: CI

on:
  push:
    paths:
      - "terminal/**"
      - "shared/**"
      - "tools/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Checkout Kraper
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KRAPER_REPOSITORY || format('{0}/Kraper', github.repository_owner) }}
          path: Kraper

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./Kraper --no-deps

      - name: Структура
        run: python -m tools.check_structure --strict

      - name: Аудит связей
        run: python -m tools.audit --check

      - name: Тесты
        run: python -m pytest

      - name: Тесты модели
        run: python -m pytest Kraper/tests

      - name: Качество роутера
        run: >-
          python -m tools.eval_intent_model
          --router --fail --bootstrap 500

      - name: Согласованность артефактов
        run: python -m tools.check_model_artifacts

      - name: Retrieval-бенчмарк
        run: python -m tools.eval_retrieval --limit 5 --fail

      - name: Компиляция
        run: >-
          python -m compileall -q terminal Kraper/kraper_model shared tests tools
