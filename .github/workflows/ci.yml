name: CI

on:
  push:
    paths:
      - "terminal/**"
      - "giperion/**"
      - "shared/**"
      - "tools/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Структура
        run: python -m tools.check_structure --strict

      - name: Тесты
        run: python -m pytest

      - name: Retrieval-бенчмарк
        run: python -m tools.eval_retrieval --limit 5 --fail

      - name: Компиляция
        run: python -m compileall -q terminal giperion shared tests tools
