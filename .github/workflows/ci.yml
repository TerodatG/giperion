name: CI

on:
  push:
    paths:
      - "terminal/**"
      - "giperion/**"
      - "shared/**"
      - "tools/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Структура
        run: python -m tools.check_structure --strict

      - name: Тесты агента
        run: >
          python -m pytest -q
          tests/test_agent_browser.py
          tests/test_agent_context_budget.py
          tests/test_agent_embeddings.py
          tests/test_agent_eval.py
          tests/test_agent_index.py
          tests/test_agent_loop.py
          tests/test_agent_mcp.py
          tests/test_agent_mcp_dialog.py
          tests/test_agent_memory.py
          tests/test_agent_retrieval.py
          tests/test_agent_semantic.py
          tests/test_agent_subagents.py
          tests/test_clean_caches.py
          tests/test_vector_store.py

      - name: Retrieval-бенчмарк
        run: python -m tools.eval_retrieval --limit 5 --fail

      - name: Компиляция
        run: python -m compileall -q terminal giperion shared tests tools
