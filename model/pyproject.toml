# GiperionModel/pyproject.toml                                        v001
# Самостоятельный проект модели Giperion.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giperion-model"
version = "1.0.0"
description = "Локальная модель Giperion: намерения, обучение и инференс"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["giperion_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
